name: Trigger one-time module rebuild

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebuild-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production module builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-fork.yml --ref main -f force=false -f publish=true

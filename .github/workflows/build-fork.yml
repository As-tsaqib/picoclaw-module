name: Build fork release

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild meski versi dan source sudah tersinkron
        required: false
        default: false
        type: boolean
      publish:
        description: Terbitkan atau perbarui GitHub Release setelah build
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-fork-release
  cancel-in-progress: false

jobs:
  sync:
    name: Check, build, and release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PICOCLAW_ANDROID_API: "21"
      PICOCLAW_NDK_VERSION: "27.3.13750724"
      PICOCLAW_SOURCE_REPOSITORY: "As-tsaqib/picoclaw"

    steps:
      - name: Checkout module repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Discover fork source
        id: source
        shell: bash
        env:
          FORCE_BUILD: ${{ inputs.force || false }}
        run: |
          set -Eeuo pipefail

          # The fork is the only build input. The module has its own SemVer.
          # shellcheck disable=SC1091
          source scripts/lib.sh
          module_version="$(tr -d '[:space:]' < MODULE_VERSION)"
          validate_module_version "$module_version"
          source_ref="$(tr -d '[:space:]' < SOURCE_REF)"
          validate_source_ref "$source_ref"
          recorded_module="$(tr -d '[:space:]' < BUILT_MODULE_VERSION)"
          recorded_ref=""
          recorded_source=""
          if [[ -f BUILT_SOURCE_REF ]]; then
            recorded_ref="$(tr -d '[:space:]' < BUILT_SOURCE_REF)"
            validate_source_ref "$recorded_ref"
          fi
          if [[ -f BUILT_SOURCE_COMMIT ]]; then
            recorded_source="$(tr -d '[:space:]' < BUILT_SOURCE_COMMIT)"
          fi
          source_sha="$(gh api "repos/$PICOCLAW_SOURCE_REPOSITORY/commits/$source_ref" --jq '.sha')"
          [[ $source_sha =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Commit source fork tidak valid: $source_sha"
            exit 1
          }
          needs_build=false
          reason="already synchronized"

          if [[ $FORCE_BUILD == true ]]; then
            needs_build=true
            reason="manual force rebuild"
          elif [[ $recorded_module != "$module_version" ]]; then
            needs_build=true
            reason="module version changed"
          elif [[ -z $recorded_ref ]]; then
            module_version="$(bump_module_patch "$module_version")"
            printf '%s\n' "$module_version" > MODULE_VERSION
            needs_build=true
            reason="source ref provenance belum tercatat"
          elif [[ $recorded_ref != "$source_ref" ]]; then
            module_version="$(bump_module_patch "$module_version")"
            printf '%s\n' "$module_version" > MODULE_VERSION
            needs_build=true
            reason="source ref changed"
          elif [[ -z $recorded_source ]]; then
            needs_build=true
            reason="source provenance belum tercatat"
          elif [[ $recorded_source != "$source_sha" ]]; then
            module_version="$(bump_module_patch "$module_version")"
            printf '%s\n' "$module_version" > MODULE_VERSION
            needs_build=true
            reason="fork source commit updated ($recorded_source -> $source_sha)"
          elif ! gh release view "$module_version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            needs_build=true
            reason="release asset is missing"
          fi

          {
            echo "module_version=$module_version"
            echo "source_repository=$PICOCLAW_SOURCE_REPOSITORY"
            echo "source_ref=$source_ref"
            echo "source_sha=$source_sha"
            echo "needs_build=$needs_build"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Fork source check"
            echo
            echo "- Source: \`$PICOCLAW_SOURCE_REPOSITORY@$source_ref\`"
            echo "- Source commit: \`$source_sha\`"
            echo "- Module version: \`$module_version\`"
            echo "- Build: \`$needs_build\` ($reason)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout PicoClaw fork source
        if: steps.source.outputs.needs_build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.source.outputs.source_repository }}
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 0
          path: picoclaw-source

      - name: Verify checked out source is the fork
        if: steps.source.outputs.needs_build == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          source_url="$(git -C picoclaw-source remote get-url origin)"
          case "${source_url%.git}" in
            https://github.com/As-tsaqib/picoclaw|git@github.com:As-tsaqib/picoclaw) ;;
            *)
              echo "::error::Checkout bukan berasal dari As-tsaqib/picoclaw: $source_url"
              exit 1
              ;;
          esac
          source_commit="$(git -C picoclaw-source rev-parse HEAD)"
          if [[ $source_commit != "${{ steps.source.outputs.source_sha }}" ]]; then
            echo "::error::Commit checkout tidak sesuai dengan commit fork yang ditemukan."
            exit 1
          fi
          {
            echo "### PicoClaw fork source"
            echo
            echo "- Repository: \`${{ steps.source.outputs.source_repository }}\`"
            echo "- Commit: \`$source_commit\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Go from fork go.mod
        if: steps.source.outputs.needs_build == 'true'
        id: setup-go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: picoclaw-source/go.mod
          cache-dependency-path: picoclaw-source/go.sum

      - name: Setup pnpm
        if: steps.source.outputs.needs_build == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        if: steps.source.outputs.needs_build == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: picoclaw-source/web/frontend/pnpm-lock.yaml

      - name: Install build tools
        if: steps.source.outputs.needs_build == 'true'
        run: sudo apt-get install -y shellcheck zip unzip jq file

      - name: Configure pinned Android NDK
        if: steps.source.outputs.needs_build == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z $android_sdk_root ]]; then
            echo "::error::ANDROID_SDK_ROOT dan ANDROID_HOME tidak tersedia"
            exit 1
          fi
          ndk_root="$android_sdk_root/ndk/$PICOCLAW_NDK_VERSION"
          compiler="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${PICOCLAW_ANDROID_API}-clang"
          if [[ ! -x $compiler ]]; then
            sdkmanager_bin="$(command -v sdkmanager || true)"
            if [[ -z $sdkmanager_bin ]]; then
              sdkmanager_bin="$android_sdk_root/cmdline-tools/latest/bin/sdkmanager"
            fi
            if [[ ! -x $sdkmanager_bin ]]; then
              echo "::error::sdkmanager tidak ditemukan: $sdkmanager_bin"
              exit 1
            fi
            "$sdkmanager_bin" "ndk;$PICOCLAW_NDK_VERSION"
          fi
          if [[ ! -x $compiler ]]; then
            echo "::error::Compiler Android NDK tidak ditemukan: $compiler"
            exit 1
          fi
          grep -Fq "Pkg.Revision = $PICOCLAW_NDK_VERSION" "$ndk_root/source.properties"
          echo "PICOCLAW_ANDROID_CC=$compiler" >> "$GITHUB_ENV"
          "$compiler" --version

      - name: Validate module sources
        if: steps.source.outputs.needs_build == 'true'
        run: ./scripts/test.sh

      - name: Validate module WebUI bundle
        if: steps.source.outputs.needs_build == 'true'
        run: ./scripts/check-webui.sh

      - name: Compile fork and package module
        if: steps.source.outputs.needs_build == 'true'
        env:
          PICOCLAW_SOURCE_REPOSITORY_URL: https://github.com/${{ steps.source.outputs.source_repository }}
          PICOCLAW_SOURCE_COMMIT: ${{ steps.source.outputs.source_sha }}
        run: ./scripts/build-fork.sh "$GITHUB_WORKSPACE/picoclaw-source" "${{ steps.source.outputs.source_ref }}" "$GITHUB_WORKSPACE/dist" "${{ steps.source.outputs.source_sha }}"

      - name: Read build metadata
        if: steps.source.outputs.needs_build == 'true'
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          source dist/metadata.env
          if [[ $MODULE_VERSION != "${{ steps.source.outputs.module_version }}" ]]; then
            echo "::error::Versi hasil package tidak sesuai: $MODULE_VERSION"
            exit 1
          fi
          if [[ $SOURCE_COMMIT != "${{ steps.source.outputs.source_sha }}" ]]; then
            echo "::error::Commit source hasil build tidak sesuai: $SOURCE_COMMIT"
            exit 1
          fi
          {
            echo "module_version=$MODULE_VERSION"
            echo "version_code=$VERSION_CODE"
            echo "asset_name=$ASSET_NAME"
            echo "archive_path=$ARCHIVE_PATH"
            echo "checksum_path=$CHECKSUM_PATH"
            echo "source_commit=$SOURCE_COMMIT"
            echo "binary_version=$BINARY_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        if: steps.source.outputs.needs_build == 'true' && (github.event_name == 'schedule' || inputs.publish == true)
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${{ steps.source.outputs.source_repository }}/commits/${{ steps.source.outputs.source_sha }}" \
            --jq '.commit.message' > dist/source-notes.md
          ./scripts/write-release-notes.sh \
            "${{ steps.source.outputs.source_ref }}" \
            "${{ steps.build.outputs.module_version }}" \
            dist/source-notes.md \
            dist/release-notes.md \
            "${{ steps.source.outputs.source_repository }}" \
            "${{ steps.source.outputs.source_sha }}" \
            "${{ steps.build.outputs.binary_version }}"

      - name: Upload workflow artifact
        if: steps.source.outputs.needs_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: picoclaw-module-${{ steps.build.outputs.module_version }}
          path: |
            ${{ steps.build.outputs.archive_path }}
            ${{ steps.build.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: steps.source.outputs.needs_build == 'true' && (github.event_name == 'schedule' || inputs.publish == true)
        shell: bash
        env:
          FORCE_BUILD: ${{ inputs.force || false }}
        run: |
          set -Eeuo pipefail
          release_tag="${{ steps.build.outputs.module_version }}"
          release_title="PicoClaw Module $release_tag"
          archive="${{ steps.build.outputs.archive_path }}"
          checksum="${{ steps.build.outputs.checksum_path }}"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ $FORCE_BUILD == true ]]; then
              gh release upload "$release_tag" "$archive" "$checksum" \
                --clobber \
                --repo "$GITHUB_REPOSITORY"
              gh release edit "$release_tag" \
                --title "$release_title" \
                --notes-file dist/release-notes.md \
                --repo "$GITHUB_REPOSITORY"
            else
              asset_name="$(basename "$archive")"
              checksum_name="$(basename "$checksum")"
              existing_assets="$(gh release view "$release_tag" --json assets --jq '.assets[].name' --repo "$GITHUB_REPOSITORY")"
              if ! grep -Fxq "$asset_name" <<< "$existing_assets"; then
                gh release upload "$release_tag" "$archive" --repo "$GITHUB_REPOSITORY"
              fi
              if ! grep -Fxq "$checksum_name" <<< "$existing_assets"; then
                gh release upload "$release_tag" "$checksum" --repo "$GITHUB_REPOSITORY"
              fi
            fi
          else
            gh release create "$release_tag" "$archive" "$checksum" \
              --title "$release_title" \
              --notes-file dist/release-notes.md \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Update repository sync state
        if: steps.source.outputs.needs_build == 'true' && (github.event_name == 'schedule' || inputs.publish == true)
        shell: bash
        run: |
          set -Eeuo pipefail
          module_version="${{ steps.build.outputs.module_version }}"
          asset_name="${{ steps.build.outputs.asset_name }}"
          release_base="https://github.com/$GITHUB_REPOSITORY/releases"

          printf '%s\n' "${{ steps.source.outputs.source_ref }}" > SOURCE_REF
          printf '%s\n' "${{ steps.source.outputs.source_ref }}" > BUILT_SOURCE_REF
          printf '%s\n' "$module_version" > BUILT_MODULE_VERSION
          printf '%s\n' "${{ steps.build.outputs.source_commit }}" > BUILT_SOURCE_COMMIT
          if [[ -f dist/release-notes.md ]]; then
            cp -f dist/release-notes.md CHANGELOG.md
          fi
          raw_changelog="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/CHANGELOG.md"
          ./scripts/write-update-json.sh \
            "$module_version" \
            "${{ steps.build.outputs.version_code }}" \
            "$release_base/download/$module_version/$asset_name" \
            "$raw_changelog" \
            update.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MODULE_VERSION SOURCE_REF BUILT_SOURCE_REF BUILT_MODULE_VERSION BUILT_SOURCE_COMMIT CHANGELOG.md update.json
          if git diff --cached --quiet; then
            echo 'Sync state tidak berubah.'
            exit 0
          fi
          git commit -m "chore: build module $module_version from fork (${{ steps.build.outputs.source_commit }})"
          git pull --rebase origin main
          git push origin HEAD:main
